services:
  db:
    container_name: db
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: backend:1.0.0
    build:
      context: ./backend
      dockerfile: go.dockerfile
    environment:
      # Pass both a constructed DATABASE_URL and individual components
      DATABASE_URL: 'postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable'
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      PORT: ${API_PORT}
    ports:
      - '${API_PORT}:8080'
    depends_on:
      - db

volumes:
  pgdata: {}
